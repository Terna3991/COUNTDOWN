<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Official Launch Countdown</title>
  <meta property="og:title" content="Official Launch Countdown">
  <meta property="og:description" content="DRUGLESS NATUROPATHIC THERAPY MEDICAL INSTITUTION NIGERIA">
  <style>
    * { box-sizing: border-box; }
    :root { --navy: #082b1f; --blue: #166534; --soft: #d9f99d; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 80% 10%, #22c55e 0, transparent 20%), radial-gradient(circle at 10% 90%, #166534 0, transparent 28%), var(--navy);
      color: white;
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 24px;
    }
    .countdown-card {
      width: min(1200px, 100%);
      min-height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 44px;
      background: rgba(9,55,39,.96);
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
      padding: 54px 40px;
      text-align: center;
    }
    .organisation {
      font-size: clamp(16px, 2.2vw, 30px);
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    h1 {
      max-width: 1040px;
      margin: 0 0 44px;
      color: var(--soft);
      font-size: clamp(24px, 4.2vw, 64px);
      line-height: 1.08;
    }
    .units {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 190px));
      gap: 24px;
      width: 100%;
      justify-content: center;
    }
    .unit {
      height: 200px;
      display: grid;
      place-content: center;
      background: white;
      border-radius: 24px;
      color: var(--navy);
      box-shadow: 0 18px 35px rgba(0,0,0,.16);
    }
    .number { font-size: clamp(44px, 7vw, 82px); font-weight: 800; line-height: 1; }
    .label { margin-top: 18px; color: var(--blue); font-size: clamp(14px, 2vw, 23px); font-weight: 800; }
    .target-date { margin-top: 42px; color: #e5e7eb; font-size: clamp(16px, 2.2vw, 30px); }
    .totals {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      color: #d9f99d;
      font-size: clamp(14px, 1.8vw, 22px);
      font-weight: 700;
    }
    #seconds { font-size: clamp(28px, 4.2vw, 48px); }
    @media (max-width: 760px) {
      .countdown-card { min-height: auto; padding: 40px 18px; }
      .units { grid-template-columns: repeat(2, minmax(120px, 180px)); gap: 12px; }
      .unit { height: 150px; }
    }
  </style>
</head>
<body>
  <main class="countdown-card">
    <div class="organisation">DRUGLESS NATUROPATHIC THERAPY MEDICAL INSTITUTION NIGERIA</div>
    <h1>OFFICIAL LAUNCH CEREMONY OF THE INSTITUTION'S WEBSITE AND BOOKS</h1>
    <div class="units" aria-live="polite">
      <div class="unit"><div class="number" id="days">00</div><div class="label">DAYS</div></div>
      <div class="unit"><div class="number" id="hours">00</div><div class="label">HOURS</div></div>
      <div class="unit"><div class="number" id="minutes">00</div><div class="label">MINUTES</div></div>
      <div class="unit"><div class="number" id="seconds">00</div><div class="label">SECONDS</div></div>
    </div>
    <div class="target-date">Saturday • November 28, 2026 • 12:00 PM (WAT)</div>
  </main>

  <script>
    const target = new Date("2026-11-28T12:00:00+01:00").getTime();

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const remaining = Math.max(target - Date.now(), 0);
      const totalSeconds = Math.floor(remaining / 1000);
      const days = Math.ceil(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      const totalHours = Math.floor(totalSeconds / 3600);
      const totalMinutes = Math.floor(totalSeconds / 60);

      document.getElementById("days").textContent = pad(days);
      document.getElementById("hours").textContent = pad(totalHours);
      document.getElementById("minutes").textContent = pad(totalMinutes);
      document.getElementById("seconds").textContent = totalSeconds.toLocaleString();
      document.getElementById("total-hours").textContent = `${totalHours.toLocaleString()} TOTAL HOURS`;
      document.getElementById("total-minutes").textContent = `${totalMinutes.toLocaleString()} TOTAL MINUTES`;

      if (remaining === 0) {
        document.querySelectorAll(".number").forEach(element => element.textContent = "00");
      }
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
